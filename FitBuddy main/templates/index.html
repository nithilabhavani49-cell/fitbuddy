<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitBuddy - AI Fitness Plan Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <h1>🏋️ FitBuddy</h1>
  <p class="subtitle">AI-powered 7-day workout &amp; nutrition plans, tailored to you.</p>

  <div class="card">
    <form action="/generate-workout" method="post">
      <label for="username">Name</label>
      <input type="text" id="username" name="username" placeholder="e.g. Alex Johnson" required />

      <label for="user_id">User ID</label>
      <input type="text" id="user_id" name="user_id" placeholder="Choose a unique ID, e.g. alex01" required />

      <label for="age">Age</label>
      <input type="number" id="age" name="age" min="10" max="100" placeholder="e.g. 28" required />

      <label for="weight">Weight (kg)</label>
      <input type="number" id="weight" name="weight" min="20" step="0.1" placeholder="e.g. 72.5" required />

      <label for="goal">Fitness Goal</label>
      <select id="goal" name="goal" required>
        <option value="" disabled selected>Select your goal</option>
        <option value="weight loss">Weight loss</option>
        <option value="muscle gain">Muscle gain</option>
        <option value="general wellness">General wellness</option>
        <option value="flexibility">Flexibility</option>
        <option value="endurance">Endurance</option>
      </select>

      <label for="intensity">Workout Intensity</label>
      <select id="intensity" name="intensity" required>
        <option value="" disabled selected>Select intensity</option>
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>

      <button type="submit">Generate Plan</button>
    </form>
  </div>

  <a class="btn btn-secondary" style="max-width:640px;width:100%;text-align:center;" href="/view-all-users">View All Users (Admin)</a>
</body>
</html>
